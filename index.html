<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Intelligence</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050912;color:#eaf6ff;font-family:Arial,sans-serif}
header{padding:16px;text-align:center;border-bottom:1px solid #18334b}
header h1{margin:0;font-size:22px;letter-spacing:3px}
header p{margin:7px 0 0;color:#82a9c5;font-size:12px}
main{padding:14px;max-width:1100px;margin:auto}
.panel{background:#0a1422;border:1px solid #19334b;border-radius:14px;margin-bottom:16px;overflow:hidden}
.panel h2{font-size:15px;margin:0;padding:14px;border-bottom:1px solid #19334b}
#globe{height:340px;width:100%;display:block}
#map{height:420px;width:100%;background:#101a27}
.note{padding:12px;color:#8da9bd;font-size:12px;line-height:1.5}
footer{text-align:center;color:#58758c;font-size:11px;padding:12px}
</style>
</head>
<body>
<header>
  <h1>EARTH INTELLIGENCE</h1>
  <p>3D EARTH • SATELLITE MAP</p>
</header>

<main>
  <section class="panel">
    <h2>🌍 3D EARTH GLOBE</h2>
    <div id="globe"></div>
    <div class="note">Drag to rotate • Pinch or scroll to zoom</div>
  </section>

  <section class="panel">
    <h2>🛰️ SATELLITE MAP</h2>
    <div id="map"></div>
    <div class="note">
      Satellite imagery is not live video. Image dates and detail vary by location.
      Drag and pinch to explore the map.
    </div>
  </section>
</main>

<footer>EARTH INTELLIGENCE • MAP DATA PROVIDED BY GOOGLE</footer>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const host = document.getElementById('globe');
const scene = new THREE.Scene();
scene.background = new THREE.Color('#050912');

const camera = new THREE.PerspectiveCamera(
  45, host.clientWidth / host.clientHeight, 0.1, 100
);
camera.position.z = 3.2;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(host.clientWidth,host.clientHeight);
host.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,2));

const light = new THREE.DirectionalLight(0xffffff,2.5);
light.position.set(5,3,5);
scene.add(light);

const loader = new THREE.TextureLoader();
const earthTexture = loader.load(
 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'
);
earthTexture.colorSpace = THREE.SRGBColorSpace;

const earth = new THREE.Mesh(
 new THREE.SphereGeometry(1,64,64),
 new THREE.MeshStandardMaterial({map:earthTexture,roughness:1})
);
scene.add(earth);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 1.5;
controls.maxDistance = 7;

function resize(){
 const w=host.clientWidth,h=host.clientHeight;
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
 renderer.setSize(w,h);
}
window.addEventListener('resize',resize);

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();
</script>

<script>
function initMap(){
  const map = new google.maps.Map(document.getElementById('map'),{
    center:{lat:20.5937,lng:78.9629},
    zoom:4,
    mapTypeId:'satellite',
    streetViewControl:false,
    mapTypeControl:true,
    fullscreenControl:true,
    zoomControl:true
  });
}
window.initMap=initMap;
</script>

<!-- Replace YOUR_API_KEY with your own key. Do not share it publicly. -->
<script async
 src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAn4AVOPt7pLx-SqKFScoZZUK3zPypMsEw&callback=initMap">
</script>
</body>
</html>
